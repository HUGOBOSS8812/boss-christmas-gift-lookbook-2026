.look .main{position:absolute;left:44px;top:132px;width:300px;height:520px}
.look .side{position:absolute;left:362px;right:44px;top:132px;bottom:150px;display:flex;flex-direction:column;gap:10px}
.look .side .c{flex:1;flex-direction:row;gap:10px;border-bottom:1px solid rgba(201,164,92,.35);padding-bottom:8px}.look .side .c .im{flex:0 0 92px;height:100%;border-radius:46px 46px 0 0;border:1px solid rgba(201,164,92,.5)}.look .side .c .tx{padding-top:0;align-self:center}
.look .main .tx{background:var(--ivory)}
.look .note{position:absolute;left:44px;right:44px;bottom:56px;font:italic 400 18px/1.4 "Cormorant Garamond",serif;color:#4a4439;border-top:1px solid rgba(201,164,92,.5);padding-top:12px}
/* set (gift box) */
.set .lid{position:absolute;left:0;right:0;top:0;height:250px;color:var(--ivory);padding:44px 54px 0}.set.him .lid{background:linear-gradient(160deg,var(--him),var(--him2))}.set.her .lid{background:linear-gradient(160deg,var(--her),var(--her2))}
.set .lid:after{content:"";position:absolute;right:90px;top:0;bottom:0;width:30px;background:linear-gradient(90deg,#8a6a2c,#e9d4a0,#8a6a2c)}
.set .lid .k{color:var(--gold2)}.set .lid h2{font:400 40px/1.02 "Cormorant Garamond",serif;margin:8px 0 10px;max-width:400px}.set .lid p{font:300 12.5px/1.55 Jost;color:#ddd4c2;max-width:400px;margin:0}
.set .items{position:absolute;left:44px;right:44px;top:278px;bottom:62px;display:grid;gap:12px}
/* match */
.match .pair{position:absolute;left:44px;right:44px;top:150px;height:520px;display:grid;gap:30px}
.match .plus{position:absolute;top:300px;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:var(--gold);color:#fff;font:300 30px/42px "Cormorant Garamond",serif;text-align:center;box-shadow:0 0 0 4px var(--ivory);z-index:3}
.match .note{position:absolute;left:44px;right:44px;bottom:60px;font:italic 400 17px/1.4 "Cormorant Garamond",serif;color:#4a4439;border-top:1px solid rgba(201,164,92,.5);padding-top:12px}
/* grids */
.g6{position:absolute;left:44px;right:44px;top:138px;bottom:62px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:18px 14px}
.g9{position:absolute;left:44px;right:44px;top:130px;bottom:60px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:12px 14px}
.g9 .c .im{border-radius:6px;border:1px solid rgba(201,164,92,.35)}.g9 .c .nm{font-size:13.5px;-webkit-line-clamp:1}
/* end */
.end{background:radial-gradient(ellipse at 50% 40%,#1d4a3a,#0b241c 60%,#061510);color:var(--ivory);text-align:center}
.end h2{position:absolute;top:250px;left:0;right:0;font:300 86px/.95 "Cormorant Garamond",serif;margin:0}.end h2 em{color:var(--gold2)}
.end p{position:absolute;top:470px;left:70px;right:70px;font:300 14px/1.8 Jost;color:#d9d2c2}.end .st{position:absolute;bottom:80px;left:0;right:0;font:500 11px Jost;letter-spacing:.3em;color:var(--gold2)}

/* ===== campaign covers v3 ===== */
.cx{position:absolute;inset:0;overflow:hidden}
.cx .fg{position:absolute}.cx .fg svg{display:block;width:100%;height:100%;overflow:visible}
.cx .snow{position:absolute;inset:-20% 0 0;pointer-events:none;background-image:radial-gradient(2px 2px at 20px 30px,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 90px 120px,#fff 50%,transparent 51%),radial-gradient(2.5px 2.5px at 160px 60px,rgba(255,255,255,.9) 50%,transparent 51%),radial-gradient(1px 1px at 60px 170px,#fff 50%,transparent 51%);background-size:200px 200px;animation:snow 14s linear infinite;opacity:.75}
.cx .snow.s2{background-size:310px 310px;animation-duration:22s;opacity:.45;filter:blur(1px)}
@keyframes snow{to{background-position:40px 400px,-30px 400px,20px 400px,-10px 400px}}

let built=false;$('tb').onclick=()=>{closeAll();const t=$('thumbs');if(!built){t.innerHTML=PGS.map((p,i)=>{const th=p.dataset.th;return `<a href="#page-${i+1}" class="${p.classList.contains('sec')?'sec '+(p.dataset.g||''):''}"><div ${th&&P[th]?`data-t="${P[th].k}"`:''}></div><b>${i+1}</b> ${p.dataset.title}</a>`}).join('');built=true;
 t.querySelectorAll('div[data-t]').forEach(d=>{const s=IMG[d.dataset.t];if(s)d.style.backgroundImage=`url('${s}')`})}
 t.querySelectorAll('a').forEach((a,i)=>a.classList.toggle('cur',idxs(cur).includes(i)));$('tov').classList.add('on')};
const SI=[];PGS.forEach((pg,i)=>pg.querySelectorAll('.c[data-id]').forEach(el=>SI.push({el,id:el.dataset.id,pg:i})));
$('sb').onclick=()=>{const b=$('search');const v=b.style.display==='block';closeAll();if(!v){b.style.display='block';$('q').focus()}};
$('q').oninput=e=>{const v=e.target.value.trim().toLowerCase();const seen=new Set();const r=v.length<2?[]:SI.filter(x=>{const p=P[x.id];if(seen.has(x.id))return false;const ok=(p.code+' '+p.name+' '+p.colour+' '+p.line+' '+p.capsule).toLowerCase().includes(v);if(ok)seen.add(x.id);return ok}).slice(0,60);
 $('sres').innerHTML=r.map(x=>{const p=P[x.id];return `<a href="#page-${x.pg+1}" data-id="${x.id}"><img src="${IMG[p.k]||B}" alt=""><div><b>${esc(p.code)}</b><br>${esc(p.name)} · ${esc(p.colour)}</div><span>p.${x.pg+1}</span></a>`}).join('')||(v.length>1?'<div style="padding:8px;color:#aaa">No match</div>':'')};
$('sres').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;const id=a.dataset.id;setTimeout(()=>{document.querySelectorAll('.page.on .c[data-id="'+id+'"]').forEach(el=>{el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),2500)})},80)});
show(fromHash(),false);
